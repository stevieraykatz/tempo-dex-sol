[profile.default]
hardfork = "tempo:T13"
via_ir = true
optimizer = true
invariant = { runs = 10, depth = 50, fail_on_revert = true }

[profile.fuzz500]
invariant = { runs = 500, depth = 500, fail_on_revert = true }

[fmt]
sort_imports = true
wrap_comments = true
ignore = ["reference/**", "test/spec/**"]

[lint]
lint_on_build = false
